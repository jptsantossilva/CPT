services:
  db:
    image: postgres:16-alpine
    container_name: cpt-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpt}
      POSTGRES_USER: ${POSTGRES_USER:-cpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpt} -d ${POSTGRES_DB:-cpt}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/jptsantossilva/cpt-backend:latest
    pull_policy: always
    container_name: cpt-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpt}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cpt}
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/jptsantossilva/cpt-frontend:latest
    pull_policy: always
    container_name: cpt-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
